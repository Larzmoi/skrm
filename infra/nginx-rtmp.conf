worker_processes auto;

events {
    worker_connections 1024;
}

# RTMP-palvelin
rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off; # EI tallenneta

            # HLS
            hls on;
            hls_path /tmp/hls;
            hls_fragment 2s;
            hls_playlist_length 10s;

            # Webhookit backendille — päivitä backendin osoite tuotannossa
            on_publish http://localhost:4000/webhooks/rtmp/start;
            on_publish_done http://localhost:4000/webhooks/rtmp/done;
        }
    }
}

http {
    server {
        listen 80;

        # HLS stream katsojille
        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /tmp;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
        }

        # Health check
        location /health {
            return 200 'ok';
        }
    }
}
